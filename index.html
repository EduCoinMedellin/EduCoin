<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Educoin | Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      class="app login-page"
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      "
    >
      <div
        class="card"
        style="width: 360px; text-align: center; box-shadow: var(--shadow-lg)"
      >
        <img
          src="assets/img/Logo_Mesa de trabajo 1.png"
          alt="Educoin Logo"
          style="height: 100px; margin: auto"
        />

        <h1 style="margin-bottom: 4px">Bienvenido</h1>
        <p class="text-muted" style="color: var(--muted); margin-bottom: 20px">
          Inicia sesión para continuar
        </p>

        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          class="input"
          placeholder="tucorreo@ejemplo.com"
        />

        <label for="password" class="mt-2">Contraseña</label>
        <input
          id="password"
          type="password"
          class="input"
          placeholder="********"
        />

        <label for="role" class="mt-2">Rol</label>
        <select id="role" class="input">
          <option value="estudiante">Estudiante</option>
          <option value="profesor">Profesor</option>
        </select>

        <button id="loginBtn" class="btn btn--primary mt-2" style="width: 100%">
          Ingresar
        </button>

        <p style="margin-top: 12px; font-size: 14px">
          ¿No tienes una cuenta?
          <a href="signup.html" style="color: var(--accent)">Crear cuenta</a>
        </p>
      </div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
