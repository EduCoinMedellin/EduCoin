<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Educoin | Estudiante</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <!-- MOBILE TOP NAV -->
      <header class="topnav-mobile">
        <button class="nav-icon" data-tab="inicio">
          <img src="assets/icons/home.svg" />
        </button>
        <button class="nav-icon" data-tab="balance">
          <img src="assets/icons/wallet.svg" />
        </button>
        <button class="nav-icon" data-tab="institucion">
          <img src="assets/icons/building.svg" />
        </button>
        <button class="nav-icon" data-tab="configuracion">
          <img src="assets/icons/settings.svg" />
        </button>
        <button class="nav-icon">
          <a href="index.html">
            <img src="assets/icons/logout.svg" />
          </a>
          
        </button>
      </header>

      <!-- DESKTOP SIDEBAR -->
      <aside class="sidebar">
        <img src="assets/img/Logo-03.png" class="logo-nav" />
        <nav>
          <button class="tab tab--active" data-tab="inicio">
            <img src="assets/icons/home.svg" />
          </button>
          <button class="tab" data-tab="balance">
            <img src="assets/icons/wallet.svg" />
          </button>
          <button class="tab" data-tab="institucion">
            <img src="assets/icons/building.svg" />
          </button>
          <button class="tab" data-tab="configuracion">
            <img src="assets/icons/settings.svg" />
          </button>
          <button class="btn btn--danger" id="logoutBtn">
            <a href="index.html">
              <img src="assets/icons/logout.svg" />
            </a>
            
          </button>
        </nav>
      </aside>

      <!-- CONTENT -->
      <main class="panel-body">
        <section class="content">
          <!-- ================= INICIO ================= -->
          <section id="inicio" class="tab-content tab-content--active">
            <div class="card welcome">
              <div>
                <h1>¡Hola, Gustavo!</h1>
                <p>¿Qué quieres hacer hoy?</p>
                <div class="quicklinks">
                  <a href="#">Ver saldo</a>
                  <a href="#">Recompensas</a>
                </div>
              </div>
              <img
                src="assets/Edu/book.png"
                alt="Mascota"
                style="height: 120px"
              />
            </div>

            <div class="grid-3">
              <div class="card card--small">
                <div class="text-muted">Saldo actual</div>
                <div id="balance" style="font-size: 20px; font-weight: 700">
                  0 EDC
                </div>
              </div>

              <div class="card card--small">
                <div class="text-muted">Moneda emitida</div>
                <div id="valueIndex" style="font-size: 20px; font-weight: 700">
                  100
                </div>
              </div>

              <div class="card card--small">
                <div class="text-muted">Recompensas</div>
                <div
                  id="rewardsCount"
                  style="font-size: 20px; font-weight: 700"
                >
                  —
                </div>
              </div>
            </div>

            <div class="card">
              <h2>Actividades recientes</h2>
              <ul id="recentActivitiesList" style="margin-top: 10px">
                <li>No hay actividades recientes.</li>
              </ul>
            </div>
          </section>

          <!-- ================= BALANCE ================= -->
          <section id="balance" class="tab-content">
            <div class="card">
              <h2>Tu Balance de Educoins</h2>
              <div
                id="detailedBalance"
                style="font-size: 22px; font-weight: 700; margin: 20px 0"
              >
                0 EDC
              </div>

              <div class="row">
                <button class="btn btn--primary" id="viewTransactions">
                  Ver transacciones
                </button>
                <button class="btn btn--ghost" id="redeemRewards">
                  Canjear recompensas
                </button>
              </div>
            </div>
          </section>

          <!-- ================= INSTITUCIÓN ================= -->
          <section id="institucion" class="tab-content"></section>

          <!-- ================= CONFIGURAR ================= -->
          <section id="configuracion" class="tab-content"></section>
        </section>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
