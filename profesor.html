<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Educoin | Profesor</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <!-- MOBILE TOP NAV -->
      <header class="topnav-mobile">
        <button class="nav-icon" data-tab="emision">
          <img src="assets/icons/emision.svg" />
        </button>
        <button class="nav-icon" data-tab="politicas">
          <img src="assets/icons/politicas.svg" />
        </button>
        <button class="nav-icon" data-tab="ledger">
          <img src="assets/icons/ledger.svg" />
        </button>
        <button class="nav-icon" data-tab="alertas">
          <img src="assets/icons/alertas.svg" />
        </button>
        <button class="nav-icon">
          <a href="index.html">
            <img src="assets/icons/logout.svg" />
          </a>

        </button>
      </header>

      <!-- DESKTOP SIDEBAR -->

        <aside class="sidebar">
          <img src="assets/img/Logo-03.png" class="logo-nav" />
          <nav>
            <button class="tab tab--active" data-tab="emision">
              <img src="assets/icons/emision.svg" />
            </button>
            <button class="tab" data-tab="politicas">
              <img src="assets/icons/politicas.svg" />
            </button>
            <button class="tab" data-tab="ledger">
              <img src="assets/icons/ledger.svg" />
            </button>
            <button class="tab" data-tab="alertas">
              <img src="assets/icons/alertas.svg" />
            </button>
            <button class="btn btn--danger" id="logoutBtn">
              <a href="index.html">
                <img src="assets/icons/logout.svg" />
              </a>
              
            </button>
        </nav>
      </aside>

      <!-- CONTENT AREA -->
      <main class="panel-body">
        <section class="content">
          <!-- =============== EMISIÓN =============== -->
          <section id="emision" class="tab-content tab-content--active">
            <h2>Emitir Educoins</h2>

            <div class="card">
              <label>Monto a emitir</label>
              <input
                id="emitAmountProf"
                type="number"
                class="input"
                placeholder="Cantidad"
              />

              <label class="mt-2">Motivo</label>
              <input
                id="emitReason"
                type="text"
                class="input"
                placeholder="Ej: Recompensa por torneo"
              />

              <div class="row mt-2">
                <button class="btn btn--primary" id="emitProfBtn">
                  Emitir
                </button>
                <button class="btn btn--ghost" id="simulateBtn">
                  Simular impacto
                </button>
              </div>
            </div>

            <!-- PANEL INFERIOR -->
            <div class="row">
              <!-- PANEL IZQUIERDO -->
              <div class="card" style="flex: 1">
                <h3>Panel de operaciones</h3>

                <label class="mt-1">Emitir Educoins (admin)</label>
                <div class="row">
                  <input
                    id="emitAmount"
                    type="number"
                    class="input"
                    placeholder="Cantidad"
                  />
                  <button id="emitBtn" class="btn btn--primary">Emitir</button>
                </div>

                <label class="mt-1">Asignar a estudiante</label>
                <div class="row">
                  <select id="studentSelect" class="input"></select>
                  <input
                    id="assignAmount"
                    type="number"
                    class="input"
                    placeholder="Cantidad"
                  />
                  <button id="assignBtn" class="btn btn--primary">
                    Asignar
                  </button>
                </div>

                <label class="mt-2">Catálogo</label>
                <div id="catalog"></div>
              </div>

              <!-- PANEL DERECHO -->
              <div class="card" style="flex: 1">
                <h3>Historial de transacciones</h3>
                <div id="history"></div>
              </div>
            </div>

            <div class="card">
              <h3>Métricas rápidas</h3>
              <div class="metrics-grid">
                <div class="metric">
                  <div class="text-muted">Oferta circulante</div>
                  <div id="circulante">— EDU</div>
                </div>
                <div class="metric">
                  <div class="text-muted">Inflación (sim)</div>
                  <div id="inflacion">— %</div>
                </div>
                <div class="metric">
                  <div class="text-muted">Índice valor</div>
                  <div id="idx">—</div>
                </div>
              </div>
            </div>
          </section>

          <!-- =============== POLÍTICAS =============== -->
          <section id="politicas" class="tab-content">
            <h2>Políticas de emisión</h2>
            <div class="card">
              <label>Tope mensual</label>
              <input
                id="capMonthly"
                type="number"
                class="input"
                placeholder="ej. 1000"
              />

              <label class="mt-2">Coeficiente alfa</label>
              <input
                id="alpha"
                type="number"
                class="input"
                placeholder="ej. 0.5"
              />

              <button id="savePolicy" class="btn btn--primary mt-2">
                Guardar políticas
              </button>
            </div>
          </section>

          <!-- =============== LEDGER =============== -->
          <section id="ledger" class="tab-content">
            <h2>Libro mayor (transacciones)</h2>
            <div class="card">
              <table class="ledger-table">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Detalle</th>
                    <th>Monto</th>
                  </tr>
                </thead>
                <tbody id="ledgerBody"></tbody>
              </table>
              <button id="exportCsv" class="btn btn--ghost mt-2">
                Exportar CSV
              </button>
            </div>
          </section>

          <!-- =============== ALERTAS =============== -->
          <section id="alertas" class="tab-content">
            <h2>Alertas</h2>
            <div id="alertsContainer"></div>
          </section>
        </section>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
